# YAYIN — GitHub Pages, özel alan adı: https://app.ablacim.com
#
# 25 Ağu: bu iş akışı "geçici test yayını" olmaktan çıktı. Site artık alt
# yolda değil, kendi alan adında kökte çalışıyor:
#   ÖNCE:  ahmet-ruchan.github.io/ablacim-landing-page/  (PUBLIC_BASE ile)
#   ŞİMDİ: app.ablacim.com                               (base '/')
#
# ⚠️ ANA SİTE BU DEĞİL. www.ablacim.com ayrı bir Next.js/Vercel projesidir
# (ablacim-dev/ablacim-frontend) ve buradan HİÇ etkilenmez. Uygulamanın kod
# içinden gittiği dört yol — /privacy-policy, /distance-sales-agreement,
# /auth/reset-password, /palm — orada durur; bu repo onlara dokunmaz.
# Sahip kararı (25 Ağu): ana site bozulmayacak, yeni sayfa ayrı alan adında.
#
# Özel alan adı `public/CNAME` ile bildiriliyor; Astro onu dist/'e kopyalar.
# CNAME dosyasını SİLME — GitHub Pages alan adını unutur ve yayın
# ahmet-ruchan.github.io'ya düşer.
name: Yayın (GitHub Pages · app.ablacim.com)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # PUBLIC_BASE SET EDİLMİYOR: site kökte çalışıyor, base '/' kalmalı.
      # Buraya bir değer yazarsan tüm varlık yolları alt yola kayar.
      # canonical / hreflang / og:url ve sitemap bu adresten türer:
      PUBLIC_SITE_URL: https://app.ablacim.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
